<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OpenOED — trademark fraud detection and office-action deadlines</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="OpenOED is a free, open workbench for trademark fraud scoring, statutory office-action deadlines, and an append-only inspector general ledger.">
  <meta name="theme-color" content="#0f3d3e">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('openoed.theme');
        var dark = t === 'dark' || ((!t || t === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
